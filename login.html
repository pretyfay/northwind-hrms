<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Northwind HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?
family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="body--auth">
<main class="auth">
<section class="auth__card">
<div class="auth__brand">
<span class="sidebar__mark">S</span>
<span class="auth__company">Northwind HRMS</span>
</div>
<h1 class="auth__title">Sign in</h1>
<p class="auth__sub">
Use your work email address
</p>
<div class="alert" id="alert" hidden></div>
<form id="loginForm" novalidate>
<div class="auth__field">
<label class="lbl" for="email">Email</label>
<input class="input select--block" id="email"
name="email" type="email"
autocomplete="username"
placeholder="name@Northwindsaudi.com">
<p class="err" data-err="email"></p>
</div>
<div class="auth__field">
<label class="lbl" for="password">Password</label>
<input class="input select--block" id="password"
name="password" type="password"
autocomplete="current-password">
<p class="err" data-err="password"></p>
</div>
<button class="btn btn--primary btn--block" type="submit"
id="submitBtn">
Sign in
</button>
</form>
<p class="auth__foot">
No account yet?
<a class="auth__link" href="register.html">Register</a>
</p>
</section>
<p class="auth__note">
Northwind Human Resource Management System
</p>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>

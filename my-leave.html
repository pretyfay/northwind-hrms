<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My leave &middot; SISCO HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?
family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<aside class="sidebar"></aside>
<div class="main">
<header class="topbar">
<div class="topbar__crumb">
<span class="topbar__crumb-root">Leave</span>
<span class="topbar__crumb-sep">/</span>
<span class="topbar__crumb-here">My leave</span>
</div>
<label class="acting">
<span class="acting__label">Acting as</span>
<select class="select select--ghost" id="userSwitcher">
</select>
</label>
</header>
<main class="page">
<div class="page__head">
<div>
<h1 class="page__title">My leave</h1>
<p class="page__sub" id="rowCount">&nbsp;</p>
</div>
</div>
<div class="alert" id="alert" hidden></div>
<div class="group-title">My balance this year</div>
<div class="stats" id="balances"></div>
<section class="panel section" style="margin-top:24px">
<div class="section__head">
<h2 class="section__title">Request leave</h2>
<p class="section__note">
A draft can be edited; once submitted it goes to HR
</p>
</div>
<form id="leaveForm" novalidate>
<div class="entry">
<div class="entry__field entry__field--wide">
<label class="lbl" for="leaveTypeId">
Leave type <span class="req">*</span>
</label>
<select class="select select--block" id="leaveTypeId"
name="leaveTypeId">
<option value="">Select&hellip;</option>
</select>
<p class="err" data-err="leaveTypeId"></p>
</div>
<div class="entry__field">
<label class="lbl" for="fromDate">
From <span class="req">*</span>
</label>
<input class="input input--date" id="fromDate"
name="fromDate" type="date">
<p class="err" data-err="fromDate"></p>
</div>
<div class="entry__field">
<label class="lbl" for="toDate">
To <span class="req">*</span>
</label>
<input class="input input--date" id="toDate"
name="toDate" type="date">
<p class="err" data-err="toDate"></p>
</div>
<div class="entry__field entry__field--wide">
<label class="lbl" for="reason">Reason</label>
<input class="input select--block" id="reason"
name="reason" type="text"
placeholder="Optional">
<p class="err" data-err="reason"></p>
</div>
<div class="entry__field entry__field--action">
<span class="hint" id="daysPreview"></span>
<button class="btn" type="button" id="draftBtn">
Save as draft
</button>
<button class="btn btn--primary" type="submit"
id="submitBtn">
Submit to HR
</button>
</div>
</div>
</form>
</section>
<section class="panel">
<div class="table-wrap">
<table class="table">
<thead>
<tr>
<th>Type</th>
<th>From</th>
<th>To</th>
<th class="num">Days</th>
<th>Reason</th>
<th class="w-status">Status</th>
<th style="width:200px">Actions</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
</div>
</div>
<script type="module" src="js/nav.js"></script>
<script type="module" src="js/my-leave.js"></script>
</body>
</html>
